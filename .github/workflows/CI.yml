# GOAL: Create ci part with Lint and push ocde to github 

name: CI-devboard

on:
  push:
    branches: [advanced]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install packages
        run: npm ci
        working-directory: frontend

      - name: Run lint
        run: npm run lint
        working-directory: frontend

      - name: Test code
        run: npm run test
        working-directory: frontend